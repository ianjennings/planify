name: Verify Fourth-Level Nested Test Generation Meta-Structure
url: https://github.com/ianjennings/planify/pulls
steps:
  - action: navigate
    url: https://github.com/ianjennings/planify/pulls
  - action: wait
    selector: '.js-issue-row'
  - action: click
    selector: 'a:has-text("🧪 Tests for #4")'
  - action: wait
    selector: '.comment-body'
  - action: scroll
    selector: '.comment-body'
assertions:
  - type: visible
    selector: '.comment-body:has-text("Generated Tests")'
  - type: visible
    selector: '.comment-body:has-text("Mechanic has analyzed this PR and generated **3** tests")'
  - type: visible
    selector: '.comment-body:has-text("Verify Nested TestDriver Test Generation Meta-Structure")'
  - type: visible
    selector: '.comment-body:has-text("Verify Self-Referential Test File Creation")'
  - type: visible
    selector: '.comment-body:has-text("Validate Artifact Upload Configuration Test Content")'
  - type: visible
    selector: '.comment-body:has-text("Rationale:")'
  - type: visible
    selector: '.comment-body:has-text("View Test YAML")'
  - type: count
    selector: '.comment-body details:has-text("View Test YAML")'
    value: 3